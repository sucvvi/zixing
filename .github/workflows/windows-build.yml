name: Windows native build and loader checks
on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  native-loader:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build with MSVC and execute Windows loader checks
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          python windows\tools\build-windows.py
          if errorlevel 1 exit /b 1
          node --test windows/tests/runtime.test.cjs
          if errorlevel 1 exit /b 1
          python windows\tools\package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZiXing-Windows-2.1.0-beta2
          path: |
            发布/字醒-v2.1.0-beta2-Windows-x64.zip
            windows/build/build-manifest.json
            windows/build/package-verification.json
          if-no-files-found: error
